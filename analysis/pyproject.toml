[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "phase0-analysis"
version = "0.7.0"
description = "Phase 0 benchmark analysis: schema validation, scoring, comparison and export (local only)."
requires-python = ">=3.12,<3.13"
# Exact resolved versions and hashes live in requirements-*-macos-arm64-py312.lock.
dependencies = [
    "jiwer==4.0.0",
    "pyannote.metrics==4.2.0",
    "jsonschema>=4,<5",
    "matplotlib>=3.10,<4",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"
