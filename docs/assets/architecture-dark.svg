<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="560" viewBox="0 0 1100 560" role="img" aria-labelledby="t d"><title id="t">voicebench architecture</title><desc id="d">A WAV file is prepared into a hashed mono spool, replayed into a bounded queue and consumed by one worker that calls the ASR adapter, then the diarization adapter. Events and telemetry are recorded to a run directory, which Python scores and validates before the run is sealed.</desc>
